# Table 3 training settings. OvA and ALCE (A-SM) override dataset settings below.
CIFAR10:
  optimizer: Adam
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  scheduler: null
  ALCE:
    weight_decay: 0.0005
    scheduler: CosineAnnealingLR

HAM10000:
  optimizer: SGD
  epochs: 150
  lr: 0.001
  weight_decay: 0.0005
  scheduler: CosineAnnealingLR
  momentum: 0.0
  nesterov: false
  OvA:
    momentum: 0.9
    nesterov: true

HateSpeech:
  optimizer: Adam
  epochs: 50
  lr: 0.01
  weight_decay: 0.0
  scheduler: CosineAnnealingLR
  ALCE:
    weight_decay: 0.0005
